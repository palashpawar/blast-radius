<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #0b1020; color: #f4f6fb;
         font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; position: relative; }
  /* blast glow behind the mark */
  .glow { position: absolute; left: -285px; top: -305px; width: 980px; height: 980px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,86,48,.40) 0%, rgba(255,139,0,.14) 34%, rgba(11,16,32,0) 66%); }
  .rings { position: absolute; left: 40px; top: 18px; }
  .title { position: absolute; left: 82px; bottom: 74px; }
  .title h1 { font-size: 118px; font-weight: 900; letter-spacing: -4px; line-height: .9; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .title p { margin-top: 16px; font-size: 34px; font-weight: 600; color: #c3cbe0; }
  .title p b { color: #ff8b00; }

  .card { position: absolute; right: 64px; top: 66px; width: 560px; background: #ffffff; color: #172b4d;
          border-radius: 26px; padding: 34px 36px 30px; transform: rotate(2.2deg);
          box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 6px rgba(255,86,48,.35); }
  .head { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; }
  .head svg { flex: none; }
  .score { margin-top: 18px; display: flex; align-items: baseline; gap: 16px; }
  .lvl { background: #ffebe6; color: #ae2e24; font-weight: 900; font-size: 34px; letter-spacing: 2px;
         padding: 6px 16px; border-radius: 10px; }
  .num { font-size: 92px; font-weight: 900; letter-spacing: -3px; color: #de350b; line-height: 1; }
  .num small { font-size: 40px; color: #8590a2; letter-spacing: 0; }
  .bar { margin-top: 14px; height: 14px; border-radius: 7px; background: #ebecf0; overflow: hidden; }
  .bar i { display: block; width: 77%; height: 100%; background: linear-gradient(90deg, #ff8b00, #de350b); }
  ul { list-style: none; margin-top: 22px; display: grid; gap: 12px; }
  li { display: flex; gap: 14px; align-items: center; font-size: 27px; font-weight: 650; }
  li span { flex: none; min-width: 58px; text-align: center; background: #ffebe6; color: #ae2e24;
            border-radius: 9px; font-weight: 900; padding: 2px 8px; }
  .chips { position: absolute; right: 70px; bottom: 58px; display: flex; gap: 12px; }
  .chip { font-size: 24px; font-weight: 700; padding: 10px 18px; border-radius: 999px;
          background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); color: #e6e9f2; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="rings" width="330" height="330" viewBox="0 0 512 512">
    <defs>
      <radialGradient id="core" cx="50%" cy="45%" r="55%">
        <stop offset="0" stop-color="#FFB38A"/><stop offset="0.45" stop-color="#FF5630"/><stop offset="1" stop-color="#DE350B"/>
      </radialGradient>
    </defs>
    <circle cx="256" cy="256" r="230" fill="none" stroke="#DE350B" stroke-width="10" stroke-linecap="round" stroke-dasharray="1240 205" transform="rotate(10 256 256)" opacity="0.3"/>
    <circle cx="256" cy="256" r="182" fill="none" stroke="#DE350B" stroke-width="18" stroke-linecap="round" stroke-dasharray="975 168" transform="rotate(-25 256 256)" opacity="0.55"/>
    <circle cx="256" cy="256" r="128" fill="none" stroke="#FF8B00" stroke-width="20" stroke-linecap="round" stroke-dasharray="700 104" transform="rotate(-160 256 256)" opacity="0.85"/>
    <circle cx="256" cy="256" r="66" fill="url(#core)"/>
    <circle cx="238" cy="236" r="18" fill="#fff" opacity="0.28"/>
  </svg>

  <div class="card">
    <div class="head">
      <svg width="38" height="38" viewBox="0 0 512 512"><circle cx="256" cy="256" r="182" fill="none" stroke="#DE350B" stroke-width="40" opacity=".4"/><circle cx="256" cy="256" r="110" fill="#FF5630"/></svg>
      PAY-2 · Retry payment auth
    </div>
    <div class="score"><span class="num">77<small>/100</small></span><span class="lvl">CRITICAL</span></div>
    <div class="bar"><i></i></div>
    <ul>
      <li><span>+40</span>Broke production before</li>
      <li><span>+15</span>Incident still open</li>
      <li><span>+10</span>Epic due in 9 days</li>
    </ul>
  </div>

  <div class="title">
    <h1>Blast<br>Radius</h1>
    <p>Know what a change will hit — <b>before it ships</b></p>
  </div>

  <div class="chips">
    <span class="chip">Jira</span><span class="chip">Rovo agent</span><span class="chip">MCP</span>
  </div>
</body>
</html>
