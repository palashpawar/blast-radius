<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="0.45" stop-color="#FF5630"/>
      <stop offset="1" stop-color="#DE350B"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151C34"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- shock rings: each ring breaks where the blast leaves the frame -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#DE350B" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="975 168" transform="rotate(-25 256 256)" opacity="0.55"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FF8B00" stroke-width="20" stroke-linecap="round"
          stroke-dasharray="700 104" transform="rotate(-160 256 256)" opacity="0.85"/>
  <!-- impact core -->
  <circle cx="256" cy="256" r="66" fill="url(#core)"/>
  <circle cx="238" cy="236" r="18" fill="#FFFFFF" opacity="0.28"/>
</svg>
